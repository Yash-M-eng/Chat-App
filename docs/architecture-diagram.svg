<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#04261E"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F26716"/>
    </marker>
  </defs>

  <rect width="1280" height="900" fill="#F2EDD5"/>

  <text x="30" y="45" font-size="24" font-weight="700" fill="#04261E">Chat App architecture</text>

  <rect x="30" y="70" width="920" height="800" rx="16" fill="none" stroke="#04261E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="96" font-size="14" font-weight="600" fill="#04261E">Client (React + Vite + TypeScript)</text>

  <g>
    <rect x="60" y="110" width="410" height="140" rx="12" fill="#FFFFFF" stroke="#D9CFA8"/>
    <text x="80" y="138" font-size="16" font-weight="700" fill="#04261E">UI components</text>
    <text font-size="13" fill="#3E4F46">
      <tspan x="80" y="164">Sidebar, SearchBar, FilterTabs, ConversationList</tspan>
      <tspan x="80" y="184">ChatWindow, ChatHeader, MessageList, MessageBubble</tspan>
      <tspan x="80" y="204">MessageInput (React Hook Form)</tspan>
      <tspan x="80" y="224">GroupInfoPanel, shared Avatar / EmptyState / ErrorState</tspan>
    </text>
  </g>

  <g>
    <rect x="510" y="110" width="410" height="140" rx="12" fill="#FFFFFF" stroke="#D9CFA8"/>
    <text x="530" y="138" font-size="16" font-weight="700" fill="#04261E">Custom hooks</text>
    <text font-size="13" fill="#3E4F46">
      <tspan x="530" y="164">useInitialData, useOpenConversation</tspan>
      <tspan x="530" y="184">useChatSimulator (20s timer, cleared on unmount)</tspan>
      <tspan x="530" y="204">useDebounce (sidebar search, 300ms)</tspan>
      <tspan x="530" y="224">useClickOutside, useApplyTheme</tspan>
    </text>
  </g>

  <g>
    <rect x="60" y="300" width="860" height="130" rx="12" fill="#084A24"/>
    <text x="80" y="328" font-size="16" font-weight="700" fill="#F2EDD5">Redux store (Redux Toolkit)</text>
    <rect x="80" y="342" width="195" height="52" rx="8" fill="#0F5C30"/>
    <text x="96" y="364" font-size="14" font-weight="700" fill="#F2EDD5">users</text>
    <text x="96" y="383" font-size="12" fill="#D6E3CF">current user, users by id</text>
    <rect x="290" y="342" width="195" height="52" rx="8" fill="#0F5C30"/>
    <text x="306" y="364" font-size="14" font-weight="700" fill="#F2EDD5">conversations</text>
    <text x="306" y="383" font-size="12" fill="#D6E3CF">list, selected, filter, typing</text>
    <rect x="500" y="342" width="195" height="52" rx="8" fill="#0F5C30"/>
    <text x="516" y="364" font-size="14" font-weight="700" fill="#F2EDD5">messages</text>
    <text x="516" y="383" font-size="12" fill="#D6E3CF">per chat, reply, editing</text>
    <rect x="710" y="342" width="195" height="52" rx="8" fill="#0F5C30"/>
    <text x="726" y="364" font-size="14" font-weight="700" fill="#F2EDD5">ui</text>
    <text x="726" y="383" font-size="12" fill="#D6E3CF">theme, group info panel</text>
    <text x="80" y="417" font-size="12" fill="#D6E3CF">Memoized selectors: selectFilteredConversations, selectSelectedConversation, selectUnreadChatsCount</text>
  </g>

  <g>
    <rect x="60" y="480" width="410" height="170" rx="12" fill="#FFFFFF" stroke="#D9CFA8"/>
    <text x="80" y="508" font-size="16" font-weight="700" fill="#04261E">Async thunks</text>
    <text font-size="13" fill="#3E4F46">
      <tspan x="80" y="534">fetchUsers, fetchConversations</tspan>
      <tspan x="80" y="554">fetchMessages, fetchOlderMessages</tspan>
      <tspan x="80" y="574">sendMessage (optimistic temp message)</tspan>
      <tspan x="80" y="594">editMessage, deleteMessage, toggleReaction</tspan>
      <tspan x="80" y="614">addMember, removeMember, markConversationRead</tspan>
    </text>
  </g>

  <g>
    <rect x="510" y="480" width="410" height="170" rx="12" fill="#FFFFFF" stroke="#F26716" stroke-width="1.5"/>
    <text x="530" y="508" font-size="16" font-weight="700" fill="#04261E">Chat simulator (chatThunks.ts)</text>
    <text font-size="13" fill="#3E4F46">
      <tspan x="530" y="534">simulateReply: typing indicator, then a message</tspan>
      <tspan x="530" y="554">simulateMessageStatus: sent → delivered → read</tspan>
      <tspan x="530" y="574">simulateRandomActivity: every 20 seconds</tspan>
      <tspan x="530" y="594">sendChatMessage, retryMessage</tspan>
    </text>
  </g>

  <g>
    <rect x="60" y="700" width="410" height="140" rx="12" fill="#FFFFFF" stroke="#D9CFA8"/>
    <text x="80" y="728" font-size="16" font-weight="700" fill="#04261E">API service (services/api.ts)</text>
    <text font-size="13" fill="#3E4F46">
      <tspan x="80" y="754">One fetch wrapper, every call in chatApi</tspan>
      <tspan x="80" y="774">Relative URLs like /api/conversations</tspan>
      <tspan x="80" y="794">Throws an Error with the server message</tspan>
    </text>
  </g>


  <g>
    <rect x="1000" y="560" width="250" height="280" rx="16" fill="#04261E"/>
    <text x="1020" y="592" font-size="16" font-weight="700" fill="#F2EDD5">Express mock API</text>
    <text x="1020" y="614" font-size="12" fill="#F26716">server folder, port 4000</text>
    <text font-size="13" fill="#D6E3CF">
      <tspan x="1020" y="646">In-memory seeded data</tspan>
      <tspan x="1020" y="668">Random 150 to 500ms delay</tspan>
      <tspan x="1020" y="690">Cursor pagination (before=id)</tspan>
      <tspan x="1020" y="712">Soft delete for messages</tspan>
      <tspan x="1020" y="734">Optional FAIL_RATE for errors</tspan>
    </text>
  </g>

  <g stroke="#04261E" stroke-width="1.8" fill="none">
    <line x1="200" y1="250" x2="200" y2="297" marker-end="url(#arrow)"/>
    <line x1="360" y1="300" x2="360" y2="253" marker-end="url(#arrow)"/>
    <line x1="715" y1="250" x2="715" y2="297" marker-end="url(#arrow)"/>
    <line x1="470" y1="180" x2="507" y2="180" marker-end="url(#arrow)"/>
    <line x1="200" y1="430" x2="200" y2="477" marker-end="url(#arrow)"/>
    <line x1="360" y1="480" x2="360" y2="433" marker-end="url(#arrow)"/>
    <line x1="265" y1="650" x2="265" y2="697" marker-end="url(#arrow)"/>
    <line x1="470" y1="760" x2="997" y2="760" marker-end="url(#arrow)"/>
    <line x1="1000" y1="800" x2="473" y2="800" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#F26716" stroke-width="1.8" fill="none">
    <line x1="715" y1="480" x2="715" y2="433" marker-end="url(#arrowOrange)"/>
    <line x1="510" y1="620" x2="473" y2="620" marker-end="url(#arrowOrange)"/>
  </g>

  <g font-size="12" fill="#04261E">
    <text x="208" y="279">dispatch</text>
    <text x="368" y="279">useAppSelector</text>
    <text x="723" y="279">dispatch</text>
    <text x="208" y="459">dispatch(thunk)</text>
    <text x="368" y="459">pending / fulfilled / rejected</text>
    <text x="273" y="679">chatApi.*</text>
    <text x="735" y="750" text-anchor="middle">fetch /api/* (Vite dev proxy)</text>
    <text x="735" y="820" text-anchor="middle">JSON response</text>
  </g>
  <g font-size="12" fill="#C2410C">
    <text x="723" y="459">typing, status updates</text>
  </g>
</svg>
